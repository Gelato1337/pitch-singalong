[project]
name = "singalong"
version = "0.1.0"
description = "Sing-Along Pitch Coach backend: offline song analysis and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
analyze = "singalong.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singalong"]

[tool.pytest.ini_options]
testpaths = ["tests"]
